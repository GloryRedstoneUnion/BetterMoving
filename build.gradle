plugins {
    id 'fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
    maven {
        name = 'TerraformersMC'
        url = 'https://maven.terraformersmc.com/releases'
        content { includeGroup 'com.terraformersmc' }
    }
    mavenCentral()
}

loom {
    mixin {
        useLegacyMixinAp = true
    }
    runs {
        client {
            client()
            name 'BetterMoving Client'
        }
    }
}

sourceSets {
    compatTest {
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
        runtimeClasspath += output + compileClasspath
    }
}

if (project.hasProperty('bettermovingCompatTest')) {
    loom {
        mods {
            bettermovingCompatTest {
                sourceSet sourceSets.compatTest
            }
        }
    }
    tasks.named('runClient').configure {
        dependsOn tasks.named('compatTestClasses')
        classpath sourceSets.compatTest.output
        if (project.hasProperty('bettermovingMovementCompatTest')) {
            jvmArgs '-Dbettermoving.movementCompatTest=true'
        }
        if (project.hasProperty('bettermovingPlatformCompatTest')) {
            jvmArgs '-Dbettermoving.platformCompatTest=true'
        }
        if (project.hasProperty('bettermovingSprintCompatTest')) {
            jvmArgs '-Dbettermoving.sprintCompatTest=true'
        }
        if (project.hasProperty('bettermovingSlipperinessCompatTest')) {
            jvmArgs '-Dbettermoving.slipperinessCompatTest=true'
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    modImplementation "maven.modrinth:malilib:${project.malilib_version}"
    modCompileOnly "com.terraformersmc:modmenu:${project.mod_menu_version}"

    if (project.hasProperty('bettermovingModMenuTest')) {
        modRuntimeOnly "com.terraformersmc:modmenu:${project.mod_menu_version}"
    }

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand version: project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 17
    options.encoding = 'UTF-8'
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

jar {
    from('LICENSE') {
        rename { "${it}_${project.archives_base_name}" }
    }
}

publishing {
    publications {
        create('mavenJava', MavenPublication) {
            from components.java
        }
    }
}
